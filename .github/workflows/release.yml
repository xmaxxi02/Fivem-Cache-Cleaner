name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name FiveM_Cache_Cleaner --distpath dist --workpath build_tmp --specpath build_tmp src/main.py

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: FiveM Cache Cleaner ${{ github.ref_name }}
          body: |
            **Download:** `FiveM_Cache_Cleaner.exe` herunterladen und starten.

            FiveM vorher schliessen. Der Cache wird automatisch geloescht und FiveM neu gestartet.
          files: dist/FiveM_Cache_Cleaner.exe
